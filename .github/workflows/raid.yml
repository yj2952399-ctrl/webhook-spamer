name: raid
on:
  workflow_dispatch:
    inputs:
      webhooks: { description: "Webhook URL（カンマ区切り）", required: true }
      count:    { description: "投稿数", default: "100" }
      content:  { description: "本文", default: "{i}" }
jobs:
  raid:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python whook.py -w "$WEBHOOKS" -c "$COUNT" --content "$CONTENT"
        env:
          WEBHOOKS: ${{ inputs.webhooks }}
          COUNT: ${{ inputs.count }}
          CONTENT: ${{ inputs.content }}