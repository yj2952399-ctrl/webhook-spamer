<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Raider</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1>Raider</h1>
  <span id="who"></span>
  <button id="logout" hidden onclick="logout()">ログアウト</button>
</header>

<section id="auth">
  <input id="u" placeholder="username" autocomplete="username">
  <input id="p" type="password" placeholder="password (8+)" autocomplete="current-password">
  <button onclick="login()">ログイン</button>
  <button onclick="register()">新規登録</button>
</section>

<main id="app" hidden>
  <nav>
    <button data-tab="run">実行</button>
    <button data-tab="hooks">Webhook</button>
    <button data-tab="set">設定</button>
    <button data-tab="jobs">履歴</button>
  </nav>

  <div class="tab" id="tab-run">
    <p class="note">登録後、最大 60 秒でワーカーが拾います。処理数とレーンで 1 分あたりの量が決まります。</p>
    <div id="active"></div>
    <button id="stopAll" class="danger" hidden onclick="stopAll()">全部 強制停止</button>
    <label>投稿数 <input id="total" type="number" value="100" min="1" max="20000"></label>

    <h2>対象チャンネル</h2>
    <p class="note">未選択なら登録済み Webhook 全部に送ります。選んだ場合はそのチャンネルの Webhook だけに飛びます。</p>
    <div id="targets"></div>
    <div class="row">
      <button onclick="allTargets()">全選択</button>
      <button onclick="noneTargets()">全解除</button>
      <button onclick="loadChannels()">更新</button>
    </div>

    <button onclick="startJob()">開始</button>
  </div>

  <div class="tab" id="tab-hooks" hidden>
    <h2>手動追加</h2>
    <input id="hlabel" placeholder="ラベル">
    <input id="hchannel" placeholder="チャンネルID（任意・分けるなら入力）">
    <textarea id="hurls" rows="4" placeholder="URL を改行 or カンマ区切り"></textarea>
    <div class="row">
      <button onclick="addHooks()">追加</button>
      <button class="danger" onclick="clearHooks()">全部削除</button>
    </div>
    <ul id="hlist"></ul>

    <h2>自動発行</h2>
    <p class="note">
      トークンは Bot でもユーザーでも可。<b>Webhook の管理</b>権限があるチャンネルにだけ作ります。
      チャンネルごとに発行数を指定してください（最大 10・0 で除外）。発行後は下の一覧に入ります。
    </p>
    <label>トークン <input id="d-token" type="password" placeholder="保存済みなら空欄でOK" autocomplete="off"></label>
    <label>サーバーID <input id="d-guild" placeholder="サーバー名を右クリック → ID をコピー"></label>
    <div class="row">
      <button onclick="saveDiscord()">保存</button>
      <button onclick="checkDiscord()">接続確認</button>
    </div>
    <div id="d-info" class="note"></div>
    <div id="d-channels"></div>
    <div class="row">
      <label>全ch に <input id="d-count" type="number" value="10" min="0" max="10"></label>
      <button onclick="fillCounts()">数を反映</button>
    </div>
    <button onclick="autoHooks()">自動発行</button>
  </div>

  <div class="tab" id="tab-set" hidden>
    <label>本文 <input id="s-content" placeholder="{i} で連番、{rand} で乱数"></label>
    <label>待機秒（Webhook 1 本あたり） <input id="s-delay" type="number" step="0.05" min="0" max="10"></label>
    <label>ゆらぎ <input id="s-jitter" type="number" step="0.05" min="0" max="5"></label>
    <label>同時送信レーン <input id="s-lanes" type="number" min="1" max="16"></label>
    <label>1 回の処理数 <input id="s-batch" type="number" min="10" max="300"></label>
    <label>再試行 <input id="s-retries" type="number" min="0" max="8"></label>
    <label>表示名偽装 <input id="s-username_override"></label>
    <label>アイコンURL <input id="s-avatar"></label>
    <label>埋め込みタイトル <input id="s-embed_title" placeholder="空なら本文で補完"></label>
    <label>埋め込み本文 <input id="s-embed_desc"></label>
    <label>画像URL <input id="s-image"></label>
    <label>サムネURL <input id="s-thumbnail"></label>
    <label>色 <input id="s-embed_color" type="number"></label>
    <label><input id="s-ping_everyone" type="checkbox"> @everyone</label>
    <label><input id="s-embed" type="checkbox"> 埋め込み</label>
    <label><input id="s-tts" type="checkbox"> TTS</label>
    <label><input id="s-delete_webhook" type="checkbox"> 完了後 Webhook 削除</label>
    <label>ログ <select id="s-log_mode">
      <option value="sample">サンプル（1/10＋エラー全件）</option>
      <option value="all">全件</option>
      <option value="errors">エラーのみ</option>
    </select></label>
    <button onclick="saveSettings()">保存</button>
  </div>

  <div class="tab" id="tab-jobs" hidden>
    <ul id="jlist"></ul>
    <div id="detail"></div>
  </div>
</main>
<script src="/app.js"></script>
</body>
</html>
